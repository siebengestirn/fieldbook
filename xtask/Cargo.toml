[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Repository task runner; all gates, e2e suites and evidence checks"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
