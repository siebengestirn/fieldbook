# Recovery-drill configuration for scripts/run-hyperliquid-evidence.sh.
#
# The collector refreshes each websocket periodically. A 60-second interval
# in a five-minute run produces several independent connection epochs, each of
# which must re-anchor every selected book with fresh exchange-originated
# l2Book snapshots. This is a controlled read-only reconnect drill: no orders,
# no credentials, no proxy and no synthetic injection into the venue feed.
exchange = "hyperliquid"

[collector]
reconnect_after_secs = 60
